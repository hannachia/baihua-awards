<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="google" content="notranslate" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="International awards and competition for singing, dance, calligraphy and painting. Copenhagen, December 2026." />
    <title>丹中国际百花奖 · Dan-Zhong International Baihua Award</title>
    <!-- Logo in the browser tab, on phone home screens, and the colour of the phone's address bar -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#F2F5F3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0E1A1D" media="(prefers-color-scheme: dark)" />
    <!-- Loading screen: appears instantly while the page downloads, then fades away when the site has started -->
    <style>
      #splash{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;background:#F2F5F3;color:#13262B;font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,-apple-system,"Segoe UI",sans-serif;transition:opacity .5s ease,visibility .5s}
      @media (prefers-color-scheme:dark){#splash{background:#0E1A1D;color:#E8EFED}}
      #splash.hide{opacity:0;visibility:hidden}
      #splash .box{display:grid;justify-items:center;gap:22px;text-align:center;padding:24px}
      #splash .logo{position:relative;width:104px;height:104px;display:grid;place-items:center}
      #splash .ring{position:absolute;inset:0;border-radius:50%;border:3px solid rgba(200,16,46,.2);border-top-color:#C8102E;animation:splash-spin 1s linear infinite}
      #splash .seal{display:grid;place-items:center;width:54px;height:60px;background:#C8102E;color:#fff;border-radius:4px;font:700 22px/1.05 "Songti SC","Noto Serif SC","SimSun",Georgia,serif;text-align:center;animation:splash-pulse 1.6s ease-in-out infinite}
      #splash .name{font:700 1.25rem/1.3 "Songti SC","Noto Serif SC","SimSun",Georgia,serif;letter-spacing:.04em}
      #splash .msg{min-height:1.2em;font-size:.9rem;opacity:.7}
      @keyframes splash-spin{to{transform:rotate(360deg)}}
      @keyframes splash-pulse{50%{transform:scale(.92);opacity:.85}}
      @media (prefers-reduced-motion:reduce){#splash .ring,#splash .seal{animation:none}}
    </style>
  </head>
  <body>
    <div id="splash" role="status" aria-live="polite">
      <div class="box">
        <div class="logo"><span class="ring"></span><span class="seal">百<br />花</span></div>
        <div class="name" id="splash-name">丹中国际百花奖</div>
        <div class="msg" id="splash-msg"></div>
      </div>
    </div>
    <script>
      // Show the name in the language the visitor chose before, and a gentle note if loading is slow
      (function () {
        var lang = 'zh';
        try { lang = localStorage.getItem('baihua_lang') || 'zh'; } catch (e) {}
        if (lang === 'en') document.getElementById('splash-name').textContent = 'Dan-Zhong International Baihua Award';
        window.__splashTimer = setTimeout(function () {
          document.getElementById('splash-msg').textContent = lang === 'en' ? 'Still loading… please keep this page open' : '仍在加载，请稍候…';
        }, 8000);
      })();
    </script>
    <noscript><p style="padding:24px;font-family:sans-serif">Please turn on JavaScript to use this website. 请开启 JavaScript 后访问本网站。</p></noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
